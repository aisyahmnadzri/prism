<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1023">
  <title>PRISM — Offline</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .offline { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center;
      background: radial-gradient(600px 300px at 100% 0%, rgba(34, 211, 238, .2), transparent 60%), linear-gradient(150deg, #0d1023, #1e1b4b 55%, #3b1d8f); color: #fff; }
    .offline img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 20px 40px -12px rgba(0, 0, 0, .6); }
    .offline h1 { font-size: 26px; margin: 20px 0 8px; }
    .offline p { color: rgba(255, 255, 255, .75); max-width: 360px; margin: 0 auto 20px; }
  </style>
</head>
<body>
  <main class="offline">
    <div>
      <img src="icons/icon-192.png" alt="PRISM">
      <h1>You're offline</h1>
      <p>This page hasn't been saved on this device yet. Check your connection, then try again.</p>
      <button class="btn btn-light" type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
</body>
</html>
